baseline = 1.0
low = 0.3
high = 1.5
scale = "log"

[[parameters]]
name = "ec_diffusivity_scale"
baseline = 1.0
low = 0.1
high = 1.0
scale = "log"

[[parameters]]
name = "sei_activation_energy_j_mol"
baseline = 50000.0
low = 40000.0
high = 60000.0
scale = "line"

[[parameters]]
name = "initial_sei_thickness_m"
baseline = 5e-9
low = 2e-9
high = 8e-9
scale = "log"

[[parameters]]
name = "cracking_rate_scale"
baseline = 1.0
low = 0.1
high = 10.0
