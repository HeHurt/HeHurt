# 使用aging_fast跑循环
Solver:
  var_pts:
    x_n: 5  # negative electrode
    x_s: 5  # separator
    x_p: 5  # positive electrode
    r_n: 30  # negative particle
    r_p: 30  # positive particle
  mode: 'safe'

Model:
  SEI: "ec reaction limited"
  SEI porosity change: "true"
  #  lithium plating: "irreversible"
  #  lithium plating porosity change: "true"  # alias for "SEI porosity change"
  #  particle mechanics: [ "swelling and cracking", "swelling only" ]
  #  SEI on cracks: "true"
  #  loss of active material: "stress-driven"
  calculate discharge energy: "true"  # for compatibility with older PyBaMM versions
  contact resistance: "true"

Battery:
  name: 'Reliability'
  params: 'aging'

Condition:
  25°C0.5P:
    condition_type: 0 # 充放电条件
    nominal: 280
    period: 0.5
    idle_time: 10
    rate: 0.5
    rate_type: 'P'
    cycle_num: 5
    temperature: 298.15

Do:
  run_type: 'sample' # 'run/optimize/scan/sample'
  num: 20
  type: 'aging' # 'base/aging'
  t_factor: 50
  accelerate_num:
    25°C0.5P: 12
  ref_step: FALSE
  pool: 8 # 并行数量
  input_params: # 优化时候不会改变的参数
    user:
      socmin_neg: 0.014138590528608774
      socmax_pos: 0.9760034190591188
      csmax_neg: 1.0255725668281699
      csmax_pos: 1.0491017547082442
      R: 0.0001
      Qx: 1
      Bruggeman: 1.5
      Dpos: 2.2391850892452856e-16
      Dneg: 2.5474103169798495e-14
      Kneg: 9.040757750960325e-10
      Kpos: 1.535118358671565e-10
    model:
      #      Inner SEI partial molar volume [m3.mol-1]: 9.645e-05
      SEI resistivity [Ohm.m]: 200000.0
      SEI kinetic rate constant [m.s-1]: 1.1327191844655663e-16
      EC diffusivity [m2.s-1]: 4.7001953891854204e-21
  #      Negative electrode cracking rate: 5.350044513565352e-23
  #      Lithium plating kinetic rate constant [m.s-1]: 0.00012740363012968313
  #      Negative electrode LAM constant proportional term [s-1]: 6.0e-7
  change_params: # 优化的时候会改变的参数
    SEI kinetic rate constant [m.s-1]: [ 'model', 'log' ,1.0e-16, 5.0e-14 ]
    EC diffusivity [m2.s-1]: [ "model", 'log' , 1.0e-22, 1.0e-20 ]
    Outer SEI partial molar volume [m3.mol-1]: [ "model", 'log' , 3.645e-5, 6.645e-5 ]
  save:
    db: True
    fileout: False
    barcode: '0IJCBA05011131B9G0000171'
    batch: 'test_sample_20241211'
    describe: '30_Sample_aging测试'
  output: 'scan_sei_result.pkl'
