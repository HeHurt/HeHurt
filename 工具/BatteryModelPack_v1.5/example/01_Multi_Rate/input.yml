Solver:
  var_pts:
    x_n: 5  # negative electrode
    x_s: 5  # separator
    x_p: 5  # positive electrode
    r_n: 30  # negative particle
    r_p: 30  # positive particle
  mode: 'safe'

Model: 'base'

Battery:
  name: 'Reliability' # 可靠性电芯数据
  params: 'base'

Condition:
  25°C0.5P:
    condition_type: 0 # 充放电条件
    nominal: 280
    period: 0.2
    idle_time: 30
    rate: 0.5
    rate_type: 'P'
  25°C1P:
    condition_type: 0 # 充放电条件
    nominal: 280
    period: 0.2
    idle_time: 30
    rate: 1
    rate_type: 'P'
  25°C2P:
    condition_type: 0 # 充放电条件
    nominal: 280
    period: 0.2
    idle_time: 30
    rate: 2
    rate_type: 'P'

Do:
  run_type: 'optimize' # 'run/optimize/scan'
  type: 'base'
  exp_data: # 读取数据
    25°C0.5P: '..\data\Rate\0.5_实际电压.dat'
    25°C1P: '..\data\Rate\1_实际电压.dat'
    25°C2P: '..\data\Rate\2_实际电压.dat'
  method: 'GO'
  method_params:
    generation_num: 5 # 迭代次数
    pool: 16 # 并行数量
    sol_per_pop: 25 # 遗传算法参数
    num_parents_mating: 16 # 遗传算法参数
    keep_parents: -1 # 遗传算法参数
  input_params:
    user:
      socmin_neg: 0.014138590528608774
      socmax_pos: 0.9760034190591188
      csmax_neg: 1.0255725668281699
      csmax_pos: 1.0491017547082442
      R: 0.0001
      Qx: 1
      Bruggeman: 1.5
  change_params:
    Dpos: [ 'user', 'log' , 0.9e-16, 5.0e-16 ]
    Dneg: [ 'user', 'log' , 2.08e-14, 3.0e-14 ]
    Kneg: [ 'user', 'log' , 7.5e-10, 1.08e-9 ]
    Kpos: [ 'user', 'log' , 7.0e-11, 3.0e-10 ]
  save:
    db: True
    fileout: False
    barcode: '0IJCBA05691111C7V0010050'
    batch: 'PyGO_test_multi_rate_20241210'
    describe: 'Multi_Rate测试'
  output: 'Output.pkl'
