Solver:
  var_pts:
    x_n: 5  # negative electrode
    x_s: 5  # separator
    x_p: 5  # positive electrode
    r_n: 30  # negative particle
    r_p: 30  # positive particle
    R_n: 30
    R_p: 30
  mode: 'safe'

Model: 'MPM'

Battery:
  name: 'Reliability' # 可靠性电芯数据
  params: 'MPM'

Condition:
  25°C0.5P:
    condition_type: 0 # 充放电条件
    nominal: 280
    period: 0.2
    idle_time: 30
    rate: 0.5
    rate_type: 'P'
  25°C1P:
    condition_type: 0 # 充放电条件
    nominal: 280
    period: 0.1
    idle_time: 30
    rate: 1
    rate_type: 'P'
  25°C2P:
    condition_type: 0 # 充放电条件
    nominal: 280
    period: 0.05
    idle_time: 30
    rate: 2
    rate_type: 'P'

Do:
  run_type: 'run' # 'run/optimize/scan'
  type: 'base'
  change_params:
    user:
      socmin_neg: 0.014138590528608774
      socmax_pos: 0.9760034190591188
      csmax_neg: 1.0255725668281699
      csmax_pos: 1.0491017547082442
      R: 0.0001
      Qx: 1
      Bruggeman: 1.5
      Dpos: 2.0530147118235602e-15
      Dneg: 8.323680416591321e-13
      Kneg: 6.06000000000001e-10
      Kpos: 4.097566343941945e-9
  output: 'Output.pkl'
