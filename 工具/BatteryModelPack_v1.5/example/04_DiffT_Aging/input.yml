# 使用aging_fast跑循环
Solver:
  var_pts:
    x_n: 5  # negative electrode
    x_s: 5  # separator
    x_p: 5  # positive electrode
    r_n: 25  # negative particle
    r_p: 25  # positive particle
  mode: 'safe'

Model:
  SEI: "ec reaction limited"
  SEI porosity change: "true"
  lithium plating: "irreversible"
  lithium plating porosity change: "true"  # alias for "SEI porosity change"
  particle mechanics: [ "swelling and cracking", "swelling only" ]
  SEI on cracks: "true"
  loss of active material: "stress-driven"
  calculate discharge energy: "true"  # for compatibility with older PyBaMM versions
  contact resistance: "true"

Battery:
  name: '314'
  params: [ 'aging', 'stipping' ]

Condition:
  15°C0.5P:
    condition_type: 0 # 充放电条件
    nominal: 314
    period: 0.5
    idle_time: 10
    rate: 0.5
    rate_type: 'P'
    cycle_num: 5
    temperature: 288.15
  25°C0.5P:
    condition_type: 0 # 充放电条件
    nominal: 314
    period: 0.5
    idle_time: 10
    rate: 0.5
    rate_type: 'P'
    cycle_num: 5
    temperature: 298.15
  35°C0.5P:
    condition_type: 0 # 充放电条件
    nominal: 314
    period: 0.5
    idle_time: 10
    rate: 0.5
    rate_type: 'P'
    cycle_num: 5
    temperature: 308.15
  45°C0.5P:
    condition_type: 0 # 充放电条件
    nominal: 314
    period: 0.5
    idle_time: 10
    rate: 0.5
    rate_type: 'P'
    cycle_num: 5
    temperature: 318.15

Do:
  run_type: 'optimize' # 'run/optimize/scan'
  type: 'aging' # 'base/aging'
  exp_data: # 读取数据
    15°C0.5P: '..\data\Age_diffT\15.dat'
    25°C0.5P: '..\data\Age_diffT\25.dat'
    35°C0.5P: '..\data\Age_diffT\35.dat'
    45°C0.5P: '..\data\Age_diffT\45.dat'
  t_factor: 50 # 加速因子
  accelerate_num: # 共跑多少次
    15°C0.5P: 4
    25°C0.5P: 4
    35°C0.5P: 4
    45°C0.5P: 4
  ref_step: False # 参考层
  initial_step: True # 初始循环
  method: 'GO'
  method_params:
    generation_num: 5 # 迭代次数
    pool: 16 # 并行数量
    sol_per_pop: 25 # 遗传算法参数
    num_parents_mating: 16 # 遗传算法参数
    keep_parents: -1 # 遗传算法参数
  input_params: # 优化时候不会改变的参数
    user:
      'socmin_neg': 0.0138
      'socmax_pos': 0.947
      'csmax_pos': 1.063
      'csmax_neg': 1.039
      Dpos: 2.4e-16
      Dneg: 1.06e-14
      Kneg: 1.2121e-9
      Kpos: 1.1131e-10
      Qx: 1.0
      "R": 1.002e-4
    model:
      Positive electrode cracking rate: 0
      Positive electrode initial crack length [m]: 0
      Positive electrode initial crack width [m]: 0
      Ratio of lithium moles to SEI moles: 1
      Inner SEI partial molar volume [m3.mol-1]: 9.645e-5
      Outer SEI partial molar volume [m3.mol-1]: 9.645e-5
      Initial inner SEI thickness [m]: 5.0e-9
      Negative electrode LAM constant proportional term [s-1]: 0
  change_params: # 优化的时候会改变的参数
    E_plating: [ 'user', 'line' , 10000, 30000 ] # 析锂的反应活化能
    SEI kinetic rate constant [m.s-1]: [ 'model', 'log'  ,1.0e-15, 5.0e-13 ]
    EC diffusivity [m2.s-1]: [ "model" , 'log' , 1.0e-23, 5.0e-21 ]
    Negative electrode cracking rate: [ 'model', 'log' , 5.0e-22, 1.0e-19 ]
    Lithium plating kinetic rate constant [m.s-1]: [ 'model', 'log' , 6.025e-6, 6.025e-5 ] # yaml的科学计数法需要有小数点才能够识别
    SEI growth activation energy [J.mol-1]: [ 'model', 'log' , 20000, 50000 ]
  save:
    db: True
    fileout: False
    barcode: '314'
    batch: 'PyBO_test_DiffT_aging_20241012'
    describe: 'DiffT_aging测试'
  output: 'BO_aging3_result.pkl'